{% extends "base.html" %}

{% load static %}

{% block nav %}{% endblock %}

{% block content %}
    <div class="container-fluid">
        <div class="row justify-content-center align-items-center vh-100 bg-secondary opacity-75">
            <div class="col-md-3">
                <div class="card shadow">
                    <div class="card-body py-4 px-5">

                        <h3 class="text-center mb-1">Fraud Graph Explorer</h3>
                        <p class="text-center text-muted mb-4">{{ login_ui.subtitle }}</p>

                        {% if form.errors %}
                        <div class="alert alert-danger text-center py-2">
                            {{ login_ui.error }}
                        </div>
                        {% endif %}

                        {% if next %}
                        <div class="alert alert-warning text-center py-2">
                            {{ login_ui.next }}
                        </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label" for="id_username">{{ login_ui.username }}</label>
                                <input type="text" name="username"
                                       id="id_username" class="form-control"
                                       autofocus autocomplete="username" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="id_password">{{ login_ui.password }}</label>
                                <input type="password" name="password"
                                       id="id_password" class="form-control"
                                        autocomplete="current-password" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    {{ login_ui.submit }}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
